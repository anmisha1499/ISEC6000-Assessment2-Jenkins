services:

  # Jenkins controller.
  # Jenkins uses the host Docker socket to launch Docker-based agents.
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    image: isec6000-jenkins:latest
    container_name: jenkins
    restart: unless-stopped

    # Docker group ID on this VM.
    group_add:
      - "137"

    ports:
      - "8080:8080"
      - "50000:50000"
      
    environment:
      JAVA_OPTS: "-Dorg.jenkinsci.plugins.durabletask.BourneShellScript.LAUNCH_DIAGNOSTICS=true"

    volumes:
      # Host Docker socket for Jenkins Docker Pipeline.
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent Jenkins data.
      - jenkins_home:/var/jenkins_home

      # Shared workspace.
      - jenkins_workspace:/var/jenkins_home/workspace

      # Docker TLS certificates.
      - jenkins_docker_certs:/certs/client:ro

    depends_on:
      - docker

    networks:
      - jenkins_network


  # Docker-in-Docker service.
  docker:
    image: docker:dind
    container_name: jenkins-docker
    restart: unless-stopped

    privileged: true

    environment:
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      - jenkins_docker_certs:/certs/client
      - jenkins_workspace:/var/jenkins_home/workspace
      - docker_data:/var/lib/docker

    networks:
      - jenkins_network

    command:
      - --storage-driver=overlay2


volumes:

  jenkins_home:

  jenkins_workspace:

  jenkins_docker_certs:

  docker_data:


networks:
  jenkins_network:
    driver: bridge
